<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Buddy - Chat</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body style="background-color: #f4f7f6; font-family: sans-serif; margin: 0;">

    <header>
    <h1> Study Buddy </h1>
    <nav class="nav">
        <a href="/">Home</a>
        <a href="/forum">Forum</a>
        <a href="/profile">Profile</a>
        <a href="/search">Search</a>
        <a href="/chat" class="active">Chat</a>
    </nav>
    {% if session.get('username') %}
        <div style="display: flex; align-items: center; gap: 15px;">
            <span style="font-weight: bold; color: #6a11cb;">⭐ <span id="pts-header">{{ points }}</span> pts</span>
            
            <a href="/logout" style="text-decoration: none;">
                <button type="button" id="SignUp">Log Out</button>
            </a>
        </div>
    {% else %}
        <a href="/auth" style="text-decoration: none;">
            <button type="button" id="SignUp">Sign Up</button>
        </a>
    {% endif %}
</header>

    <main style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        <div id="chat-container" style="background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden;">
            <div id="chat-display" style="height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9;"></div>
            <div style="padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white;">
                <input type="text" id="message-input" placeholder="Type a message..." style="flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none;">
                <button id="send-btn" style="background: #6a11cb; color: white; border: none; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-weight: bold;">Send</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <script>
        const socket = io();
        const display = document.getElementById('chat-display');
        const input = document.getElementById('message-input');
        const btn = document.getElementById('send-btn');

        btn.onclick = () => {
            if (input.value.trim() !== "") {
                socket.emit('send_message', { message: input.value });
                input.value = "";
            }
        };

        socket.on('receive_message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.style.padding = "10px";
            msgDiv.style.background = "white";
            msgDiv.style.borderRadius = "10px";
            msgDiv.style.border = "1px solid #eee";
            msgDiv.innerHTML = `
                <strong style="color: #6a11cb;">${data.username}:</strong> ${data.message}
                <button onclick="award('${data.username}')" style="margin-left:10px; background:#B2DFDB; border:none; cursor:pointer; border-radius:5px; padding:2px 5px; font-size:10px;">Helpful +2</button>
            `;
            display.appendChild(msgDiv);
            display.scrollTop = display.scrollHeight;
        });

        function award(helper) { socket.emit('award_points', { helper: helper }); }

        socket.on('update_points', (data) => {
            document.getElementById('pts-num').innerText = data.points;
        });
    </script>
</body>
</html>
