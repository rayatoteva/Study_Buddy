<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Buddy - Chat</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body style="background-color: #f4f7f6; font-family: sans-serif; margin: 0;">

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h1 style="margin: 0;">Study Buddy</h1>
        <nav class="nav">
            <a href="/" style="margin-right: 15px; text-decoration: none; color: #333;">Home</a>
            <a href="/forum" style="margin-right: 15px; text-decoration: none; color: #333;">Forum</a>
            <a href="/profile" style="margin-right: 15px; text-decoration: none; color: #333;">Profile</a>
            <a href="/chat" style="text-decoration: none; color: #ff6b6b; font-weight: bold;">Chat</a>
        </nav>

        {% if session.get('username') %}
            <a href="/logout" style="text-decoration: none;">
                <button type="button" id="SignUp" style="background: #ff6b6b; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer;">Log Out</button>
            </a>
        {% else %}
            <a href="/auth" style="text-decoration: none;">
                <button type="button" id="SignUp" style="background: #ff6b6b; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer;">Sign Up</button>
            </a>
        {% endif %}
    </header>

    <main style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        <div id="chat-container" style="background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden;">
            
            <div id="chat-display" style="height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9;">
                <p style="color: #888; text-align: center;">Welcome to the Study Buddy Chat!</p>
            </div>
            
            <div style="padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white;">
                <input type="text" id="message-input" placeholder="Type a message..." style="flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none;">
                <button id="send-btn" style="background: #6a11cb; color: white; border: none; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-weight: bold;">Send</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>

    <script>
        const socket = io(); 
        const display = document.getElementById('chat-display');
        const input = document.getElementById('message-input');
        const btn = document.getElementById('send-btn');

        btn.onclick = () => {
            if (input.value.trim() !== "") {
                socket.emit('send_message', { message: input.value });
                input.value = ""; 
            }
        };

        input.addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                btn.click();
            }
        });

        socket.on('receive_message', (data) => {
            const msgDiv = document.createElement('div');

            msgDiv.style.padding = "10px 15px";
            msgDiv.style.background = "white";
            msgDiv.style.borderRadius = "15px";
            msgDiv.style.border = "1px solid #eee";
            msgDiv.style.width = "fit-content";
            msgDiv.style.maxWidth = "80%";
            msgDiv.style.boxShadow = "0 2px 5px rgba(0,0,0,0.05)";
            msgDiv.style.marginBottom = "5px";

            msgDiv.innerHTML = `<strong style="color: #6a11cb;">${data.username}:</strong> ${data.message}`;
            
            display.appendChild(msgDiv);

            display.scrollTop = display.scrollHeight;
        });
    </script>
</body>
</html>
