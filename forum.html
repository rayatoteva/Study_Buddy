<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Study Buddy</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>

<body>
    <header> 
        <h1> Study Buddy </h1>
        <nav class="nav">
            <a href="/">Home</a>
            <a href="/forum">Forum</a>
            <a href="/profile">Profile</a>
            <a href="/chat">Chat</a>
        </nav>

        {% if session.get('username') %}
            <a href="/logout" style="text-decoration: none;">
                <button type="button" id="SignUp">Log Out</button>
            </a>
        {% else %}
            <a href="/auth" style="text-decoration: none;">
                <button type="button" id="SignUp">Sign Up</button>
            </a>
        {% endif %}
    </header>
    <main>
        <section class="card-forum">
            <div class="maths">
                <div class="subject_forum-header">
                    <h3> Mathematika </h3>
                    <button type="button"> Add a grade </button>
                </div>
                <span> CLASSES </span>
                <div class="grades">
                    <a href=""> 8th grade </a>
                    <a href=""> 9th grade </a>
                    <a href=""> 10th grade </a>
                    <a href=""> 11th grade </a>
                    <a href=""> 12th grade </a> 
                </div>
                
            </div>
            <div class="angl">
                <div class="subject_forum-header">
                    <h3> English </h3>
                    <button type="button"> Add a grade </button>
                </div>
                
                <span> CLASSES </span>
                <div class="grades">
                    <a href=""> 8th grade </a>
                    <a href=""> 9th grade </a>
                    <a href=""> 10th grade </a>
                    <a href=""> 11th grade </a>
                </div>
                
            </div>
            <div class="hist">
                <div class="subject_forum-header">
                    <h3> History </h3>
                    <button type="button"> Add a grade </button>
                </div>
                <span> CLASSES </span>
                <div class="grades">
                    <a href=""> 8th grade </a>
                    <a href=""> 9th grade </a>
                    <a href=""> 10th grade </a>
                    <a href=""> 11th grade </a>
                    <a href=""> 12th grade </a> 
                </div>
            </div>
        </section>
    </main>
    <script src="/script.js"></script>
</body>

</html>
