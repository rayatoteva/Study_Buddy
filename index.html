<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Study Buddy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1> Study Buddy </h1>
        <nav class="nav">
            <a href="#Home" class="active"> Home</a>
            <a href="#Forum">Forum</a>
            <a href="#Search">Search</a>
            <a href="#Profile">Profile</a>
        </nav>
        <button type="button" id="SignUp">Sign Up</button>
    </header>
    <main>
        <section class="statistics">
            <div class=" statistics-item points">
                <h4> Your points </h4>
                <p> 5 </p>
            </div>
            <div class="statistics-item rating">
                <h4> Your rating </h4>
                <p> No ratings yet </p>
            </div>
            <div class="statistics-item subjects">
                <h4> Subjects </h4>
                <p> 7 </p>
            </div>
            <div class="statistics-item students">
                <h4> Students </h4>
                <p> 3 </p>
            </div>
        </section>

        <section class="col-2">
            <div class="col-2-item your_subjects">
                <span class="card-header">
                    <h3> Your Subjects </h3>
                    <a href="#Profile"> Edit </a>
                </span>
                <p class="help"> Need help with</p>
                <span class="subjects">
                    <p class="subject-item uvod"> Uvod v programiraneto </p>
                    <p class="subject-item bel"> Bulgarski ezik </p>
                    <p class="subject-item math"> Matematika </p>
                
                </span>
            </div>
            <div class="col-2-item top_helpers">
                <h3> Top Helpers </h3>
                <p> No helpers yet </p>
            </div>
        </section>

    </main>
</body>

</html>
